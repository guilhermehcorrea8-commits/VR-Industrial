
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Oficina VR SENAI</title>

  <meta
    name="description"
    content="Simulador industrial 3D para treinamento profissional SENAI."
  >

  <link rel="stylesheet" href="./style.css">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <div id="loading">
    <div class="loading-card">
      <div class="loading-spinner"></div>
      <h1>OFICINA VR SENAI</h1>
      <p id="loading-message">Preparando o ambiente industrial...</p>
    </div>
  </div>

  <div id="game">
    <header id="topbar">
      <div class="brand">
        <strong>OFICINA VR</strong>
        <span>SENAI · TREINAMENTO INDUSTRIAL</span>
      </div>

      <div id="status">Inicializando...</div>
    </header>

    <div id="crosshair">+</div>

    <section id="help-panel">
      <strong>CONTROLES</strong>
      <p><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> Movimentar</p>
      <p><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> Alternativa</p>
      <p>Mouse: olhar ao redor</p>
      <p>Toque/clique: selecionar máquina</p>
    </section>

    <div id="message" role="status" aria-live="polite"></div>

    <div id="mobile-controls">
      <div class="movement-pad">
        <button data-move="forward" aria-label="Avançar">▲</button>
        <div class="movement-row">
          <button data-move="left" aria-label="Mover para esquerda">◀</button>
          <button data-move="backward" aria-label="Recuar">▼</button>
          <button data-move="right" aria-label="Mover para direita">▶</button>
        </div>
      </div>

      <button id="look-button" type="button">OLHAR / TOCAR</button>
    </div>

    <footer id="bottombar">
      <span>SIMULADOR 3D</span>
      <span id="selected-object">Nenhuma máquina selecionada</span>
    </footer>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
